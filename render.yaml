services:
  - type: web
    name: scal-ai
    env: python
    plan: standard
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    # Persistent disk keeps chat_history.db across deploys and restarts.
    # Mount to /data (NOT /opt/render/project/src which is the source dir).
    # app.py uses DB_DIR env var to locate the database file.
    disk:
      name: chat-db
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DB_DIR
        value: "/data"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: KB_INGEST_PASSWORD
        sync: false
      - key: KB_INGEST_SECRET
        sync: false
      - key: ADMIN_PIN
        sync: false
