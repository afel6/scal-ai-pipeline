name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run Tests
      env:
        PYTHONPATH: .
      run: |
        pytest tests/ \
          --ignore=tests/test_rag_database.py \
          --ignore=tests/test_hviel_behavioral.py \
          --ignore=tests/test_handler.py \
          --ignore=tests/test_centrifuge.py \
          --ignore=tests/test_models.py \
          --ignore=tests/test_hardening.py \
          --ignore=tests/test_stress.py \
          --ignore=tests/test_vision.py \
          --ignore=tests/test_physics_and_skills_exhaustive.py \
          -v --tb=short
